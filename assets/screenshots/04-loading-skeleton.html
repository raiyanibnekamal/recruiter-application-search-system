<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Screenshot: Loading Skeleton</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .ink { color: #0b0d12; }
  .muted { color: #5b6473; }
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .shimmer {
    background: linear-gradient(90deg, #f1f5f9 0%, #e2e8f0 50%, #f1f5f9 100%);
    background-size: 800px 100%;
    animation: shimmer 1.4s linear infinite;
  }
</style>
</head>
<body class="px-4 py-10">
<div class="mx-auto max-w-3xl">
  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-xl font-semibold ink">Applications Search</h1>
    <a class="text-sm muted">Sign out</a>
  </div>

  <input value="rahm" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-base ink shadow-sm" />
  <span class="text-xs muted ml-2">typing&hellip;</span>

  <div class="mt-3 flex items-center justify-between text-sm muted">
    <span>Loading&hellip;</span>
    <span>Debounced 300 ms</span>
  </div>

  <ul class="divide-y divide-slate-100 mt-4">
    <li class="flex items-start gap-4 border-b border-slate-100 px-2 py-4">
      <div class="h-10 w-10 shrink-0 rounded-full bg-slate-100"></div>
      <div class="flex-1 space-y-2">
        <div class="h-3 w-1/3 rounded shimmer"></div>
        <div class="h-3 w-1/2 rounded shimmer"></div>
        <div class="h-3 w-2/3 rounded shimmer"></div>
      </div>
    </li>
    <li class="flex items-start gap-4 border-b border-slate-100 px-2 py-4">
      <div class="h-10 w-10 shrink-0 rounded-full bg-slate-100"></div>
      <div class="flex-1 space-y-2">
        <div class="h-3 w-1/3 rounded shimmer"></div>
        <div class="h-3 w-1/2 rounded shimmer"></div>
        <div class="h-3 w-2/3 rounded shimmer"></div>
      </div>
    </li>
    <li class="flex items-start gap-4 border-b border-slate-100 px-2 py-4">
      <div class="h-10 w-10 shrink-0 rounded-full bg-slate-100"></div>
      <div class="flex-1 space-y-2">
        <div class="h-3 w-1/3 rounded shimmer"></div>
        <div class="h-3 w-1/2 rounded shimmer"></div>
        <div class="h-3 w-2/3 rounded shimmer"></div>
      </div>
    </li>
  </ul>
</div>
</body>
</html>
