<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Recruiter sign-in — Applications Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root { --accent: #2563eb; }
      body { background: #f8fafc; }
      .bg-accent { background: var(--accent); }
      .text-ink { color: #0f172a; }
      .text-muted { color: #64748b; }
    </style>
  </head>
  <body class="font-sans antialiased">
    <main class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-6">
      <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <h1 class="text-2xl font-semibold text-ink">Recruiter sign-in</h1>
        <p class="mt-2 text-sm text-muted">
          Access is gated by RLS &mdash; only authenticated recruiters can read
          applicant rows. Anonymous keys return <code class="rounded bg-slate-100 px-1">[]</code>.
        </p>

        <div class="mt-6 inline-flex rounded-lg border border-slate-200 bg-slate-50 p-1 text-sm">
          <button type="button" class="rounded-md bg-white px-3 py-1.5 text-ink shadow">Password</button>
          <button type="button" class="rounded-md px-3 py-1.5 text-muted hover:text-ink">Magic link</button>
        </div>

        <form class="mt-6 space-y-3">
          <label class="block text-sm font-medium text-ink" for="email">Work email</label>
          <input id="email" type="email" placeholder="you@company.com"
                 class="w-full rounded-lg border border-slate-200 px-3 py-2 text-base" />
          <label class="block text-sm font-medium text-ink" for="password">Password</label>
          <input id="password" type="password" placeholder="at least 6 characters"
                 class="w-full rounded-lg border border-slate-200 px-3 py-2 text-base" />
          <button type="button" class="w-full rounded-lg bg-accent px-4 py-2 text-sm font-medium text-white shadow-sm">Sign in</button>
        </form>

        <p class="mt-6 text-center text-xs text-muted">
          Accounts are provisioned by your administrator. If you need access,
          ask the team to create one in Supabase Auth → Users.
        </p>
      </div>
    </main>
  </body>
</html>
